
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Sorry 💗</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff5fa, #ffdce9);
      color: #74415b;
    }
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      padding: 38px 25px;
      border-radius: 28px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 20px 60px #d66c982b;
      text-align: center;
    }
    .eyebrow {
      color: #bb6a8d;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .big-heart {
      font-size: 54px;
      margin: 15px 0;
      animation: pulse 2s infinite;
    }
    h1 {
      color: #d34b87;
      font-size: clamp(30px, 7vw, 42px);
      margin: 12px 0 20px;
    }
    p {
      font-size: 17px;
      line-height: 1.8;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 25px;
    }
    button {
      border: none;
      border-radius: 30px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .yes {
      background: #db508c;
      color: white;
    }
    .smile {
      background: #ffe0ed;
      color: #a83d6b;
    }
    button:hover { transform: scale(1.04); }
    button:focus-visible {
      outline: 3px solid #9d386a;
      outline-offset: 3px;
    }
    #result {
      min-height: 45px;
      margin-top: 22px;
      color: #b83f75;
      font-weight: bold;
      line-height: 1.6;
    }
    .heart {
      position: fixed;
      bottom: -40px;
      pointer-events: none;
      animation: floatUp 5s linear forwards;
    }
    @keyframes floatUp {
      to { transform: translateY(-110vh); opacity: 0; }
    }
    @keyframes pulse {
      50% { transform: scale(1.15); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">A little note from my heart</div>
    <div class="big-heart">💗</div>

    <h1>I'm really sorry</h1>

    <p>
      I'm really sorry. You mean a lot to me,
      and I want to make things right. 💗
    </p>

    <div class="buttons">
      <button class="yes" onclick="hearMeOut()">
        Hear me out 💌
      </button>
      <button class="smile" onclick="makeSmile()">
        A little smile? 🌷
      </button>
    </div>

    <div id="result" role="status" aria-live="polite"></div>
    <small>Made with care, just for you ♡</small>
  </main>

  <script>
    function hearMeOut() {
      document.getElementById("result").textContent =
        "Thank you for hearing me out 💗 " +
        "I'll do my best to show you I mean it.";
      hearts();
    }

    function makeSmile() {
      document.getElementById("result").textContent =
        "Sending you a little bouquet 🌷💐 " +
        "You deserve kindness and smiles.";
      hearts();
    }

    function hearts() {
      if (window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches) return;

      for (let i = 0; i < 15; i++) {
        const heart = document.createElement("span");
        heart.className = "heart";
        heart.textContent = ["💗", "💕", "♡"][i % 3];
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize =
          (15 + Math.random() * 18) + "px";
        heart.style.animationDelay =
          Math.random() * 1.5 + "s";

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 7000);
      }
    }
  </script>
</body>
</html>
